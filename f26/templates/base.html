<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"></script>
    <style>
      .card-body { padding: .25rem; }
      .text-muted { font-weight: 300; color: #000 !important; }
      td, th { border: 1px solid; }
    </style>
    {% block header %}{% endblock %}
    <title>CS 356: Computer Networks Fall 2026</title>
  </head>
  <body style="background-color: #bf5700">
    <div class="container" style="background-color: #fff; padding-top:30pt;">
      <div class="d-flex justify-content-between align-items-center">
        <h1>CS 356: Computer Networks</h1><h2 class="text-muted">Fall 2026</h2>
      </div>
      <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
          <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav mr-auto">
              {% for item in navigation %}<li class="nav-item {% if item.active %}active{% endif %}"><a class="nav-link" href="{{ item.url }}">{{ item.name }}</a></li>{% endfor %}
            </ul>
          </div>
        </div>
      </nav>
      <br><br>
      {% block content %}{% endblock %}
    </div>
  </body>
</html>
