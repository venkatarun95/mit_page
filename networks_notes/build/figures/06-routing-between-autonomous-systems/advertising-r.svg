<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 314" role="img">
  <title>Advertisements for R: A passes the route learned from B to customers, but withholds it from U</title>
  <defs>
    <marker id="offer" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147c70"/></marker>
    <marker id="other" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#4e6173"/></marker>
  </defs>
  <rect width="680" height="314" rx="10" fill="#f1f6f5"/>
  <g font-family="system-ui,sans-serif" text-anchor="middle" fill="#143437">
    <g fill="none" stroke-width="2.5">
      <g stroke="#147c70" marker-end="url(#offer)">
        <path d="M518 232V165"/><path d="M496 130L363 68"/><path d="M490 140H179"/>
        <path d="M140 162L95 232"/><path d="M173 160L224 232"/>
      </g>
      <path d="M318 68L174 124" stroke="#4e6173" marker-end="url(#other)"/>
      <path d="M165 108L282 61" stroke="#a35640" stroke-dasharray="6 5"/>
      <path d="M279 54l6 14m4-12l-14 10" stroke="#a35640"/>
    </g>
    <g fill="#fff" stroke="#516d6b" stroke-width="2">
      <circle cx="340" cy="56" r="21"/><circle cx="155" cy="140" r="21"/><circle cx="518" cy="140" r="21"/>
      <circle cx="82" cy="254" r="18"/><circle cx="238" cy="254" r="18"/><circle cx="518" cy="254" r="18"/>
    </g>
    <g font-size="18" font-weight="650">
      <text x="340" y="62">U</text><text x="155" y="146">A</text><text x="518" y="146">B</text>
      <text x="82" y="260">P</text><text x="238" y="260">Q</text><text x="518" y="260">R</text>
    </g>
    <g font-size="14">
      <text x="537" y="204" text-anchor="start">[R]</text>
      <text x="449" y="86">[B, R]</text><text x="336" y="130">[B, R]</text>
      <text x="230" y="127">[U, B, R]</text>
      <text x="198" y="63" fill="#82462e">[A, B, R] withheld</text>
      <text x="69" y="194">[A, B, R]</text><text x="251" y="194">[A, B, R]</text>
      <text x="338" y="293">Arrows show the direction of advertisements for R’s prefix.</text>
    </g>
  </g>
</svg>
