    <marker id="backup" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#4e6173"/></marker>
  </defs>
  <rect width="680" height="257" rx="10" fill="#f1f6f5"/>
  <g font-family="system-ui,sans-serif" text-anchor="middle" fill="#143437">
    <g fill="none" stroke-width="2.5">
