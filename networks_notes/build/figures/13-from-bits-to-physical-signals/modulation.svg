<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img" aria-labelledby="title">
 <title id="title">A one-megahertz modulation creates side components</title>
 <rect x="1" y="1" width="758" height="258" rx="14" fill="#f6f8fb" stroke="#d6dfe8"/>
 <g font-family="system-ui,sans-serif" fill="#1d2938">
  <text x="34" y="39" font-size="22" font-weight="700">Frequencies in the modulated signal</text>
  <path d="M76 187H686" stroke="#a7b8c9" stroke-width="2"/>
  <path d="M228 187V114M532 187V114" stroke="#206477" stroke-width="5"/>
  <path d="M380 187V85" stroke="#214a68" stroke-width="5"/>
  <g text-anchor="middle" font-size="17"><text x="228" y="104">Lower side component</text><text x="380" y="75">Carrier</text><text x="532" y="104">Upper side component</text><text x="228" y="213">99 MHz</text><text x="380" y="213">100 MHz</text><text x="532" y="213">101 MHz</text></g>
  <text x="380" y="241" text-anchor="middle" font-size="15">Example: amplitude varies sinusoidally at 1 MHz</text>
 </g>
</svg>
