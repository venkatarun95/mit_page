<svg xmlns="http://www.w3.org/2000/svg" width="720" height="239" viewBox="0 0 720 239" role="img" aria-labelledby="ttl ds">
  <title id="ttl">Synchronized replies converge on one output</title>
  <desc id="ds">Three worker streams each enter the output queue at ten gigabits per second. The link from the queue to the front end can carry ten gigabits per second total.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#315e55"/></marker></defs>
  <rect x="1" y="1" width="718" height="237" rx="16" fill="#f7faf8"/>
  <g fill="none" stroke="#315e55" stroke-width="3" marker-end="url(#arr)">
    <path d="M132 49L323 111"/><path d="M132 119H323"/><path d="M132 189L323 127"/><path d="M445 119H575"/>
  </g>
  <g stroke="#315e55" stroke-width="1.7" fill="white">
    <rect x="27" y="28" width="105" height="42" rx="7"/><rect x="27" y="98" width="105" height="42" rx="7"/><rect x="27" y="168" width="105" height="42" rx="7"/>
    <rect x="324" y="98" width="121" height="42" rx="7"/><rect x="580" y="98" width="112" height="42" rx="7"/>
  </g>
  <g stroke="#59786c" stroke-width="1">
    <rect x="334" y="106" width="28" height="26" fill="#c7e3d7"/><rect x="370" y="106" width="28" height="26" fill="#e0ba9d"/><rect x="406" y="106" width="28" height="26" fill="#c6d8eb"/>
  </g>
  <g fill="#183c36" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">
    <text x="79" y="55">Worker 1</text><text x="79" y="125">Worker 2</text><text x="79" y="195">Worker 3</text>
    <text x="208" y="60">10 Gbit/s</text><text x="208" y="109">10 Gbit/s</text><text x="208" y="186">10 Gbit/s</text>
    <text x="384" y="83">Output queue</text><text x="510" y="104">10 Gbit/s</text><text x="636" y="125">Front end</text>
  </g>
</svg>
