<svg xmlns="http://www.w3.org/2000/svg" width="760" height="339" viewBox="0 0 760 339" role="img" aria-labelledby="title desc">
  <title id="title">Aggregating the Market routes</title>
  <desc id="desc">The original table uses two /26 Market entries. The compressed table uses one /25 Market entry. Both keep the Weather /27 and the same forwarding decisions.</desc>
