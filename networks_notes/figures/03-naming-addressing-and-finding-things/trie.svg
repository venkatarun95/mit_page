<svg xmlns="http://www.w3.org/2000/svg" width="760" height="323" viewBox="0 0 760 323" role="img" aria-labelledby="title desc">
  <title id="title">Finding the longest matching prefix</title>
  <desc id="desc">The walk from the default to the Weather route uses bit 1 at position 26 and bit 0 at position 27. The first 25 bits are abbreviated.</desc>
<rect x="0" y="0" width="760" height="323" rx="0" fill="#f7faf9" stroke="none"/>
<line x1="380" y1="59" x2="380" y2="105" stroke="#076764" stroke-width="2.2" stroke-dasharray="5 4"/>
<text x="394" y="84" text-anchor="start" font-family="system-ui, sans-serif" font-size="14" font-weight="400" fill="#405a62">First 25 matching bits</text>
<line x1="380" y1="145" x2="211" y2="202" stroke="#a6bcbf" stroke-width="1.5"/>
<line x1="380" y1="145" x2="545" y2="202" stroke="#076764" stroke-width="2.2"/>
<text x="284" y="168" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="17" font-weight="700" fill="#405a62">0</text>
<text x="472" y="168" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="17" font-weight="700" fill="#076764">1</text>
<line x1="545" y1="249" x2="545" y2="278" stroke="#076764" stroke-width="2.2"/>
<text x="560" y="268" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="17" font-weight="700" fill="#076764">0</text>
<rect x="275.0" y="13" width="210" height="45" rx="7" fill="#e2f2ed" stroke="none"/>
<text x="380" y="32" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="14" font-weight="700" fill="#076764">0.0.0.0/0</text>
<text x="380" y="49" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="400" fill="#076764">Uplink</text>
<rect x="259.0" y="101" width="242" height="45" rx="7" fill="white" stroke="#a6bcbf"/>
<text x="380" y="120" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="14" font-weight="700" fill="#405a62">198.51.100.0/25</text>
<text x="380" y="137" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="400" fill="#405a62">Shared prefix, no next hop</text>
<rect x="100.5" y="195" width="221" height="45" rx="7" fill="white" stroke="#a6bcbf"/>
<text x="211" y="214" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="14" font-weight="700" fill="#405a62">198.51.100.0/26</text>
<text x="211" y="231" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="400" fill="#405a62">Market</text>
<rect x="434.5" y="195" width="221" height="45" rx="7" fill="#e2f2ed" stroke="none"/>
<text x="545" y="214" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="14" font-weight="700" fill="#076764">198.51.100.64/26</text>
<text x="545" y="231" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="400" fill="#076764">Market</text>
<rect x="434.5" y="274" width="221" height="45" rx="7" fill="#e2f2ed" stroke="none"/>
<text x="545" y="293" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="14" font-weight="700" fill="#076764">198.51.100.64/27</text>
<text x="545" y="310" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="400" fill="#076764">Weather</text>
</svg>
