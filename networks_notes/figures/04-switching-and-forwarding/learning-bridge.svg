<svg xmlns="http://www.w3.org/2000/svg" width="760" height="311" viewBox="0 0 760 311" role="img" aria-labelledby="title desc">
  <title id="title">How a bridge learns where to send frames</title>
  <desc id="desc">The first frame floods on ports 2 and 3. The reply goes only to port 1. The next frame goes only to port 2.</desc>
