<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 307" role="img">
  <title>Illustrative traceroute from P to R, with a missing response at hop 2</title>
  <rect width="680" height="307" rx="10" fill="#f1f6f5"/>
  <rect x="24" y="20" width="632" height="265" rx="9" fill="#143437"/>
  <g font-family="ui-monospace,monospace" font-size="16" fill="#f9fbfa">
    <text x="50" y="55">traceroute 203.0.113.27</text>
    <path d="M50 72H630M50 108H630" stroke="#829895"/>
    <g fill="#bfe3de">
      <text x="50" y="96">Hop</text><text x="119" y="96">Reply address</text><text x="342" y="96">Inferred network</text>
    </g>
    <text x="52" y="139">1</text><text x="119" y="139">10.150.0.1</text><text x="342" y="139">P (known locally)</text>
    <text x="52" y="169">2</text><text x="119" y="169">* * *</text><text x="342" y="169">unknown</text>
    <text x="52" y="199">3</text><text x="119" y="199">192.0.2.14</text><text x="342" y="199">A</text>
    <text x="52" y="229">4</text><text x="119" y="229">198.51.100.18</text><text x="342" y="229">B</text>
    <text x="52" y="259">5</text><text x="119" y="259">203.0.113.27</text><text x="342" y="259">R (destination)</text>
  </g>
</svg>
