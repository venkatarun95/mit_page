<svg xmlns="http://www.w3.org/2000/svg" width="650" height="220" viewBox="0 0 650 220" role="img" aria-labelledby="title desc">
  <title id="title">Two paths can reverse arrival order</title>
  <desc id="desc">Packet 1 departs at zero and arrives at 15 milliseconds. Packet 2 departs at one and arrives at 11 milliseconds.</desc>
  <rect x="1" y="1" width="648" height="218" rx="16" fill="#f7faf8"/>
  <g stroke="#bacbc6" stroke-width="2" stroke-dasharray="4 4"><path d="M145 59V170M174 59V170M464 59V170M580 59V170"/></g>
  <path d="M145 59H580" stroke="#a14e2e" stroke-width="5"/>
  <path d="M174 113H464" stroke="#315e55" stroke-width="5"/>
  <g fill="#a14e2e"><circle cx="145" cy="59" r="6"/><path d="M570 51L586 59L570 67Z"/></g>
  <g fill="#315e55"><circle cx="174" cy="113" r="6"/><path d="M454 105L470 113L454 121Z"/></g>
  <path d="M145 170H595" stroke="#243e3d" stroke-width="2"/>
  <g fill="#163532" font-family="system-ui, sans-serif" font-size="16">
    <text x="25" y="65">Packet 1</text><text x="25" y="119">Packet 2</text>
    <text x="25" y="195">Time (ms)</text>
    <g text-anchor="middle"><text x="145" y="195">0</text><text x="174" y="195">1</text><text x="464" y="195">11</text><text x="580" y="195">15</text></g>
    <text x="354" y="42" text-anchor="middle">Slower path</text><text x="314" y="96" text-anchor="middle">Faster path</text>
  </g>
</svg>
