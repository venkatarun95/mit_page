<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 248" role="img" aria-labelledby="title desc">
  <title id="title">One-bit neighborhoods</title>
  <desc id="desc">The codeword 000 and its one-bit neighbors 001, 010 and 100. The other codeword 111 has neighbors 110, 101 and 011. The two sets are disjoint.</desc>
  <style>
    text {font-family:system-ui,sans-serif;font-size:17px;fill:#162436}
    .code {font-family:ui-monospace,monospace;font-weight:600;font-size:20px}
    .links {fill:none;stroke:#94a7ba;stroke-width:2}
  </style>
  <rect x="10" y="12" width="340" height="220" rx="15" fill="#eef6fa" stroke="#c4dce9"/>
  <rect x="370" y="12" width="340" height="220" rx="15" fill="#f7f2e8" stroke="#e4d5b4"/>
  <g text-anchor="middle">
    <text x="180" y="47">Codeword and its one-bit neighbors</text>
    <text x="540" y="47">Codeword and its one-bit neighbors</text>
    <path class="links" d="M180 113V143 M180 113L86 143 M180 113L274 143 M540 113V143 M540 113L446 143 M540 113L634 143"/>
    <g fill="#c7e0ed"><rect x="142" y="71" width="76" height="42" rx="9"/><rect x="502" y="71" width="76" height="42" rx="9" fill="#ebd7ad"/></g>
    <g fill="#fff" stroke="#c0cbd5">
      <rect x="48" y="143" width="76" height="42" rx="9"/><rect x="142" y="143" width="76" height="42" rx="9"/><rect x="236" y="143" width="76" height="42" rx="9"/>
      <rect x="408" y="143" width="76" height="42" rx="9"/><rect x="502" y="143" width="76" height="42" rx="9"/><rect x="596" y="143" width="76" height="42" rx="9"/>
    </g>
    <text class="code" x="180" y="99">000</text><text class="code" x="540" y="99">111</text>
    <text class="code" x="86" y="171">001</text><text class="code" x="180" y="171">010</text><text class="code" x="274" y="171">100</text>
    <text class="code" x="446" y="171">110</text><text class="code" x="540" y="171">101</text><text class="code" x="634" y="171">011</text>
    <text x="180" y="216">Decode as 0 with at most one flip</text>
    <text x="540" y="216">Decode as 1 with at most one flip</text>
  </g>
</svg>
