<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-labelledby="title desc">
  <title id="title">A miss travels beyond the nearest cache</title>
  <desc id="desc">The viewer goes to a local edge. An edge miss goes to a regional cache that another edge shares. A regional miss goes to the origin.</desc>
  <style>text { font-family: system-ui,sans-serif; fill: #162436 }</style>
  <rect x="8" y="8" width="704" height="234" rx="14" fill="#f7f9fb" stroke="#d0dbe5"/>
  <rect x="32" y="52" width="146" height="55" rx="7" fill="#fff" stroke="#9bb2c4"/>
  <text x="105" y="75" text-anchor="middle" font-size="16" font-weight="650">Viewer</text>
  <text x="105" y="95" text-anchor="middle" font-size="13" font-weight="400">Asks for the segment</text>
  <rect x="211" y="52" width="146" height="55" rx="7" fill="#dcebf3" stroke="#9bb2c4"/>
  <text x="284" y="75" text-anchor="middle" font-size="16" font-weight="650">Local edge</text>
  <text x="284" y="95" text-anchor="middle" font-size="13" font-weight="400">Serve if cached</text>
  <rect x="389" y="52" width="146" height="55" rx="7" fill="#dcebf3" stroke="#9bb2c4"/>
  <text x="462" y="75" text-anchor="middle" font-size="16" font-weight="650">Regional cache</text>
  <text x="462" y="95" text-anchor="middle" font-size="13" font-weight="400">Serve if cached</text>
  <rect x="548" y="176" width="146" height="55" rx="7" fill="#f3e5c7" stroke="#9bb2c4"/>
  <text x="621" y="199" text-anchor="middle" font-size="16" font-weight="650">Origin</text>
  <text x="621" y="219" text-anchor="middle" font-size="13" font-weight="400">Holds the object</text>
  <rect x="211" y="176" width="146" height="55" rx="7" fill="#fff" stroke="#9bb2c4"/>
  <text x="284" y="199" text-anchor="middle" font-size="16" font-weight="650">Another edge</text>
  <text x="284" y="219" text-anchor="middle" font-size="13" font-weight="400">Shares the parent</text>
  <polygon points="179.00,81.50 201.00,81.50 201.00,78.50 179.00,78.50" fill="#346a86"/>
  <polygon points="209,80 201.0,76.0 201.0,84.0" fill="#346a86"/>
  <polygon points="357.00,81.50 379.00,81.50 379.00,78.50 357.00,78.50" fill="#346a86"/>
  <polygon points="387,80 379.0,76.0 379.0,84.0" fill="#346a86"/>
  <polygon points="358.27,194.80 407.00,117.57 404.46,115.97 355.73,193.20" fill="#346a86"/>
  <polygon points="410,110 402.34817467423517,114.63136796033136 409.11399917280613,118.90028103681068" fill="#346a86"/>
  <polygon points="501.91,109.03 558.43,169.20 560.62,167.14 504.09,106.97" fill="#346a86"/>
  <polygon points="565,174 562.4379885950636,165.4305135765919 556.6072040183117,170.9079172699043" fill="#346a86"/>
  <text x="373" y="44" text-anchor="middle" font-size="13" font-weight="600">Edge miss</text>
  <text x="601" y="130" text-anchor="middle" font-size="13" font-weight="600">Regional miss</text>
</svg>
